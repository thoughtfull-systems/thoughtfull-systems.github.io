# Vale configuration — prose linting for this blog.
# Style choice favours prose quality over documentation house-style:
# proselint + write-good, plus Vale's built-in spelling/consistency checks.
StylesPath = .vale/styles

# Report everything down to suggestions; the pre-commit hook blocks on any finding.
MinAlertLevel = suggestion

# Downloaded by `vale sync` into StylesPath.
Packages = proselint, write-good

# Project vocabulary of accepted terms (technical jargon, proper nouns,
# coinages). Add words here rather than fighting the spell checker.
Vocab = Blog

# Only lint the author's content, not theme or vendored markdown.
[content/**/*.md]
BasedOnStyles = Vale, proselint, write-good

# E-Prime bans every "to be" verb (is/are/was/be...) — a fringe style that
# fights normal, reflective prose. Disabled.
write-good.E-Prime = NO

# Hyperbole flags any "!!" — but Clojure core.async has legitimate `!!`
# functions (alts!!, >!!, <!!), and "!!" is also used here for comedic effect.
# Disabled.
proselint.Hyperbole = NO
